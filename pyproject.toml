[project]
name = "nix-installer"
version = "0.1.0"
description = "my nix installer"
readme = "README.md"
authors = [{ name = "Joao Pedro", email = "vieiraleao2005@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "coisas",
    "cyclopts>=4.16.1",
    "pydantic>=2.13.4",
]

[project.scripts]
nix-installer = "nix_installer:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
coisas = { path = "../coisas", editable = true }
